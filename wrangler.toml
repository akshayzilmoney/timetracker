name = "ats-sync"
main = "ats-worker.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "ATS_KV"
id = "a7f8ef463eca4f5cbd64476389474940"

# 16:30 UTC = 22:00 IST and 18:20 UTC = 23:50 IST - nightly snapshots of
# everyone's punch state; the later one overwrites, the earlier is a fallback
[triggers]
crons = ["30 16 * * *", "20 18 * * *"]
